name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write   # needed for the coverage PR comment

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven            # caches ~/.m2 for faster builds

      - name: Build, run unit tests, and generate coverage
        run: mvn -B clean verify

      - name: Show coverage in job summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F',' 'NR>1 {im+=$4; ic+=$5; lm+=$8; lc+=$9}
              END {
                printf "### Code Coverage\n\n| Metric | Coverage |\n|---|---|\n";
                printf "| Lines | %.1f%% |\n", (lc/(lm+lc))*100;
                printf "| Instructions | %.1f%% |\n", (ic/(im+ic))*100;
              }' target/site/jacoco/jacoco.csv >> $GITHUB_STEP_SUMMARY
          fi

      - name: Comment coverage on pull request
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.7.1
        with:
          paths: ${{ github.workspace }}/target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 70
          min-coverage-changed-files: 70

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # "Run the project" smoke test (optional)
  run-app:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run application
        run: java -jar *.jar